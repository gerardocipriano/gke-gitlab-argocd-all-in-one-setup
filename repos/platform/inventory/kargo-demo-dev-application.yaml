# Stage dev della demo Kargo.
# La sorgente è il branch stage/dev, che NON si modifica a mano: lo scrive Kargo a ogni
# promozione con i manifest già renderizzati da kustomize.
# L'annotazione authorized-stage autorizza lo Stage kargo-demo/dev a pilotare questa
# Application: senza di essa lo step argocd-update viene rifiutato.
# selfHeal è attivo solo su questo stage: una modifica fatta a mano nel cluster viene
# riportata allo stato del branch entro pochi secondi. Su staging e prod resta disattivo,
# quindi la sincronizzazione la richiede Kargo al termine della promozione.
# prune resta false: il branch contiene i manifest di un solo stage e non deve poter
# cancellare risorse che non conosce.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-demo-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-demo:dev
  labels:
    app.kubernetes.io/name: kargo-demo-dev
    app.kubernetes.io/component: application
    kargo.akuity.io/stage: dev
spec:
  project: gitops
  source:
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/kargo-demo.git
    targetRevision: stage/dev
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo-demo-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
