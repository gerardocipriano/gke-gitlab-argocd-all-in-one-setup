# Stage prod della demo Kargo.
# La sorgente è il branch stage/prod, che NON si modifica a mano: lo scrive Kargo a ogni
# promozione con i manifest già renderizzati da kustomize.
# L'annotazione authorized-stage autorizza lo Stage kargo-demo/prod a pilotare questa
# Application: senza di essa lo step argocd-update viene rifiutato.
# Nessun sync automatico: la sincronizzazione la richiede Kargo al termine della promozione.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-demo-prod
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-demo:prod
  labels:
    app.kubernetes.io/name: kargo-demo-prod
    app.kubernetes.io/component: application
    kargo.akuity.io/stage: prod
spec:
  project: gitops
  source:
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/kargo-demo.git
    targetRevision: stage/prod
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo-demo-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
