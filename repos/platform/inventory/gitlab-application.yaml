---
# GitLab Application - Managed by App of Apps
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  namespace: argocd
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: infrastructure
spec:
  project: gitops
  source:
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/platform.git
    targetRevision: HEAD
    path: gitlab
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
