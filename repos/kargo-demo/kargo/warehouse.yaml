# Warehouse con due sottoscrizioni: ogni Freight porta insieme un tag di podinfo e un commit
# della configurazione. Una nuova immagine o un commit sotto app/ producono
# ciascuno un Freight nuovo, che segue la stessa catena di promozione.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kargo-demo
  namespace: kargo-demo
spec:
  subscriptions:
    # Tilde e non caret: ~6.9.0 resta nella serie 6.9, mentre ^6.9.0 prenderebbe l'ultima 6.x
    # e la demo partirebbe già dall'ultima versione.
    - image:
        repoURL: ghcr.io/stefanprodan/podinfo
        constraint: "~6.9.0"
        discoveryLimit: 5
    # includePaths: solo app/. Un commit sulle risorse Kargo in kargo/ (per esempio questo file)
    # non deve diventare un Freight.
    - git:
        repoURL: http://gitlab.gitlab.svc.cluster.local/root/kargo-demo.git
        branch: main
        includePaths:
          - app
        discoveryLimit: 5
