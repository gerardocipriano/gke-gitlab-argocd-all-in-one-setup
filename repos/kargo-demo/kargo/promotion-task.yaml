# PromotionTask: clona il repo al commit del Freight, imposta il tag dell'immagine, renderizza
# l'overlay dello stage, committa il risultato sul branch dello stage e chiede il sync ad ArgoCD.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: demo-promo-process
  namespace: kargo-demo
spec:
  vars:
    - name: gitopsRepo
      value: http://gitlab.gitlab.svc.cluster.local/root/kargo-demo.git
    - name: imageRepo
      value: ghcr.io/stefanprodan/podinfo
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        checkout:
          # Il commit di configurazione contenuto nel Freight, non la punta di main: promuovere
          # in prod lo stesso Freight di staging deve dare lo stesso risultato.
          - commit: ${{ commitFrom(vars.gitopsRepo).ID }}
            path: ./src
          - branch: stage/${{ ctx.stage }}
            create: true
            path: ./out
    - uses: git-clear
      config:
        path: ./out
    - uses: kustomize-set-image
      as: update
      config:
        path: ./src/app/base
        images:
          - image: ${{ vars.imageRepo }}
            tag: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: kustomize-build
      config:
        path: ./src/app/stages/${{ ctx.stage }}
        outPath: ./out/manifests.yaml
    - uses: git-commit
      as: commit
      config:
        path: ./out
        # Il default (outputs.update.commitMessage) cita il path in ./src, che su questo
        # branch non esiste: il messaggio deve dire cosa è stato promosso e dove.
        message: "promote podinfo ${{ imageFrom(vars.imageRepo).Tag }} + config ${{ commitFrom(vars.gitopsRepo).ID[0:8] }} to ${{ ctx.stage }}"
    - uses: git-push
      config:
        path: ./out
    - uses: argocd-update
      config:
        apps:
          - name: kargo-demo-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}
