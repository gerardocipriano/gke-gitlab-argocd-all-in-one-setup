# Stage della pipeline di promozione Kargo: dev, staging, prod.
# Ogni Stage riceve una Freight dalla Warehouse (direct per dev, dagli stage precedenti per gli altri)
# e riusa la stessa PromotionTask demo-promo-process. dev si promuove da solo
# (promotionPolicy nel Project), staging e prod si promuovono a mano.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: kargo-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo-demo
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - task:
            name: demo-promo-process
          as: promo-process
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo-demo
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      steps:
        - task:
            name: demo-promo-process
          as: promo-process
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-demo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kargo-demo
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      steps:
        - task:
            name: demo-promo-process
          as: promo-process
