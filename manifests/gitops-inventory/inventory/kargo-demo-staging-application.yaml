# Stage staging della demo Kargo.
# La sorgente è il branch stage/staging, che NON si modifica a mano: lo scrive Kargo a ogni
# promozione con i manifest già renderizzati da kustomize.
# L'annotazione authorized-stage autorizza lo Stage kargo-demo/staging a pilotare questa
# Application: senza di essa lo step argocd-update viene rifiutato.
# Nessun sync automatico: la sincronizzazione la richiede Kargo al termine della promozione.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-demo-staging
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo-demo:staging
  labels:
    app.kubernetes.io/name: kargo-demo-staging
    app.kubernetes.io/component: application
    kargo.akuity.io/stage: staging
spec:
  project: gitops
  source:
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/gitops.git
    targetRevision: stage/staging
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: kargo-demo-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
