# Deployment dell'applicazione demo: un singolo nginx esposto sulla porta 80.
# Il tag immagine e' gestito via kustomize e viene aggiornato ad ogni promozione Kargo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kargo-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kargo-demo
  template:
    metadata:
      labels:
        app: kargo-demo
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.26.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
