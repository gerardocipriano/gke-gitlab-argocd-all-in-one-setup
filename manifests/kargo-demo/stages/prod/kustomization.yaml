# Overlay di Kustomize per lo stage prod: tre replica.
# Consumato da Kargo PromotionTask tramite kustomize-build per generare i manifesti renderizzati.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: kargo-demo
    count: 3
labels:
  - pairs:
      kargo.akuity.io/stage: prod
    includeSelectors: true
