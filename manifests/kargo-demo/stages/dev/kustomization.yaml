# Overlay dello stage dev: 1 repliche e il colore della UI, per riconoscere l'ambiente a colpo d'occhio.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: kargo-demo
    count: 1
labels:
  - pairs:
      kargo.akuity.io/stage: dev
    includeSelectors: true
patches:
  - target:
      kind: Deployment
      name: kargo-demo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "#0d6a64"
