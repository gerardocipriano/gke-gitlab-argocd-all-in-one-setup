---
# GitLab CE Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
  labels:
    app: gitlab
---
# GitLab CE Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-pvc
  namespace: gitlab
  labels:
    app: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config-pvc
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# GitLab CE Deployment (Single Pod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-ce
  namespace: gitlab
  labels:
    app: gitlab
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
      component: server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitlab
        component: server
    spec:
      shareProcessNamespace: true
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:18.6.0-ce.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.local'
                gitlab_rails['initial_root_password'] = 'Gk3B00tstr4p2025xZ'
                gitlab_rails['initial_shared_runners_registration_token'] = 'token'
                gitlab_rails['gitlab_shell_ssh_port'] = 22
                postgresql['shared_buffers'] = "256MB"
                sidekiq['max_concurrency'] = 5
                prometheus_monitoring['enable'] = false
                # Omnibus dimensiona puma sul numero di CPU del nodo, non sul limit del
                # container: su un nodo grosso apre piu' worker di quanti la memoria
                # richiesta ne sostenga e il pod viene evicted. Due worker bastano.
                puma['worker_processes'] = 2
                registry['enable'] = false
                gitlab_kas['enable'] = false
          # requests == limits: su GKE Autopilot la request dimensiona il nodo, e un pod
          # Burstable che sfora finisce evicted per memoria del nodo (visto a 5.4Gi con
          # request 4Gi). 8Gi coprono l'avvio di Rails, Gitaly e Postgres insieme.
          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "2"
          volumeMounts:
            - name: gitlab-data
              mountPath: /var/opt/gitlab
            - name: gitlab-logs
              mountPath: /var/log/gitlab
            - name: gitlab-config
              mountPath: /etc/gitlab
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-pvc
        - name: gitlab-logs
          emptyDir: {}
        - name: gitlab-config
          persistentVolumeClaim:
            claimName: gitlab-config-pvc
---
# GitLab CE Service (NodePort for kind access via extraPortMappings)
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
  selector:
    app: gitlab
    component: server
