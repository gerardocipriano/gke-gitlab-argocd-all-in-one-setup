---
# GitLab CE Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
  labels:
    app: gitlab
---
# GitLab CE Persistent Volume Claim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-pvc
  namespace: gitlab
  labels:
    app: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# GitLab CE Deployment (Single Pod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-ce
  namespace: gitlab
  labels:
    app: gitlab
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
      component: server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gitlab
        component: server
    spec:
      # Required for GitLab to work properly
      shareProcessNamespace: true
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:18.6.0-ce.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.local'
                gitlab_rails['initial_root_password'] = 'GitLabAdmin123!'
                gitlab_rails['gitlab_shell_ssh_port'] = 30222
                # Minimize memory usage for development
                postgresql['shared_buffers'] = "256MB"
                sidekiq['max_concurrency'] = 10
                # Disable unnecessary services
                prometheus_monitoring['enable'] = false
                # Disable Geo and other enterprise features
                geo_primary_role['enable'] = false
                geo_secondary_role['enable'] = false
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "6Gi"
              cpu: "4"
          volumeMounts:
            - name: gitlab-data
              mountPath: /var/opt/gitlab
            - name: gitlab-logs
              mountPath: /var/log/gitlab
            - name: gitlab-config
              mountPath: /etc/gitlab
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-pvc
        - name: gitlab-logs
          emptyDir: {}
        - name: gitlab-config
          emptyDir: {}
---
# GitLab CE Service (LoadBalancer for cloud-provider-kind)
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
  selector:
    app: gitlab
    component: server
---
# GitLab CE Service (NodePort for direct access)
apiVersion: v1
kind: Service
metadata:
  name: gitlab-nodeport
  namespace: gitlab
  labels:
    app: gitlab
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: ssh
      nodePort: 30222
      protocol: TCP
  selector:
    app: gitlab
    component: server
