<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitOps dal vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #f2f5f4; --panel: #ffffff; --panel-2: #eaefed; --line: #d7dfdd; --line-strong: #b9c5c2;
    --ink: #101a1d; --body: #3c4a4e; --mute: #5f6e71; --accent: #0d6a64; --accent-soft: #dfeeec;
    --warn: #8f5c06; --warn-soft: #f6ecd8; --danger: #9b2f2a; --danger-soft: #f7e6e4;
    --ok: #2c6b3c; --ok-soft: #dfeee2;
    --shadow: 0 1px 2px rgba(16, 26, 29, .06);
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0c1316; --panel: #131d21; --panel-2: #18242a; --line: #24333a; --line-strong: #35474f;
      --ink: #e8f0ee; --body: #a7b7ba; --mute: #8a9ca0; --accent: #53bfb3; --accent-soft: #14312f;
      --warn: #d69b45; --warn-soft: #2e2415; --danger: #e0817a; --danger-soft: #331d1c;
      --ok: #74c088; --ok-soft: #16301d; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0c1316; --panel: #131d21; --panel-2: #18242a; --line: #24333a; --line-strong: #35474f;
    --ink: #e8f0ee; --body: #a7b7ba; --mute: #8a9ca0; --accent: #53bfb3; --accent-soft: #14312f;
    --warn: #d69b45; --warn-soft: #2e2415; --danger: #e0817a; --danger-soft: #331d1c;
    --ok: #74c088; --ok-soft: #16301d; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--body);
    font: 20px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  h1, h2, h3, p { margin: 0; }
  a { color: var(--accent); }
  code { font-family: var(--mono); font-size: .92em; }
  .mono { font-family: var(--mono); }
  .eyebrow { font-family: var(--mono); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }

  /* barra alta */
  .top {
    display: flex; align-items: center; gap: 16px 22px; flex-wrap: wrap;
    padding: 10px 28px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: 20px; color: var(--ink); font-weight: 600; letter-spacing: -.01em; }
  .pill {
    font-family: var(--mono); font-size: 14px; color: var(--mute); white-space: nowrap;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--panel-2);
  }
  .pill[data-tone="ok"] { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
  .pill[data-tone="warn"] { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .pill[data-tone="danger"] { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  .rail { flex: 1 1 520px; display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; min-width: 0; }
  .rail li {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 4px;
    font-size: 14px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rail li::before { content: ""; height: 4px; border-radius: 2px; background: var(--line); }
  .rail li[data-state="done"]::before { background: var(--ok); }
  .rail li[data-state="now"] { color: var(--ink); font-weight: 600; }
  .rail li[data-state="now"]::before { background: var(--accent); }

  /* griglia */
  main {
    flex: 1 1 auto; display: grid; gap: 24px; padding: 24px 28px 28px;
    grid-template-columns: minmax(0, 58fr) minmax(0, 42fr); align-items: start;
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }

  /* colonna sinistra */
  .story { display: grid; gap: 22px; }
  .chapter-head { display: grid; gap: 10px; }
  .chapter-head h2 { font-size: 46px; line-height: 1.1; color: var(--ink); font-weight: 600; letter-spacing: -.02em; }
  .idea { font-size: 26px; line-height: 1.4; color: var(--body); max-width: 34em; }
  .points { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
  .points[hidden] { display: none; }
  .points li { font-size: 25px; line-height: 1.35; color: var(--ink); padding-left: 26px; position: relative; }
  .points li::before { content: ""; position: absolute; left: 0; top: .5em; width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
  .fade { animation: fade .22s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .question { padding: 20px 22px; display: grid; gap: 14px; }
  .question[hidden] { display: none; }
  .q-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .q-label { font-family: var(--mono); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .q-text { font-size: 28px; line-height: 1.3; color: var(--ink); font-weight: 500; }
  .opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .opt {
    display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 14px; align-items: start;
    padding: 12px 16px; border: 1.5px solid var(--line); border-radius: 6px; font-size: 23px; line-height: 1.35;
    color: var(--ink); background: var(--panel); transition: opacity .2s, background .2s, border-color .2s;
  }
  .opt .letter {
    font-family: var(--mono); font-weight: 600; font-size: 20px; color: var(--mute);
    width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line-strong);
    display: grid; place-items: center;
  }
  .question[data-phase="reveal"] .opt { opacity: .42; }
  .question[data-phase="reveal"] .opt.right { opacity: 1; border-color: var(--ok); background: var(--ok-soft); }
  .question[data-phase="reveal"] .opt.right .letter { color: var(--ok); border-color: var(--ok); }
  .why {
    font-size: 22px; line-height: 1.45; color: var(--ink); background: var(--panel-2);
    border-left: 4px solid var(--ok); border-radius: 4px; padding: 12px 16px;
  }
  .vote { font-size: 18px; color: var(--mute); }

  .look { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .look .eyebrow { margin-right: 4px; }
  .look a {
    font-size: 18px; text-decoration: none; color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--accent); border-radius: 6px; padding: 6px 14px; font-weight: 500;
  }
  .look a:hover, .look a:focus-visible { background: var(--accent); color: var(--panel); outline: none; }
  .status-line { display: flex; gap: 12px; align-items: center; font-size: 20px; color: var(--ink); min-height: 30px; }
  .status-line[hidden] { display: none; }
  .status-line .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* colonna destra: pipeline */
  .pipeline { padding: 18px 20px; display: grid; gap: 0; }
  .pipeline > .eyebrow { margin-bottom: 12px; display: flex; justify-content: space-between; }
  .node { border: 1px solid var(--line); border-radius: 7px; padding: 12px 14px; background: var(--panel); position: relative; transition: background .4s, border-color .4s; }
  .node.flash { background: var(--accent-soft); border-color: var(--accent); }
  .node-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .node-name { font-size: 22px; font-weight: 600; color: var(--ink); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-family: var(--mono); font-size: 14px; border-radius: 4px; padding: 1px 7px; border: 1px solid var(--line); color: var(--mute); background: var(--panel-2); white-space: nowrap; }
  .badge[data-tone="ok"] { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
  .badge[data-tone="warn"] { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .badge[data-tone="danger"] { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  .badge[data-tone="accent"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .node-body { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
  .tag small { font-size: 17px; font-weight: 400; color: var(--mute); margin-right: 6px; }
  .tag.behind { color: var(--warn); }
  .meta { font-family: var(--mono); font-size: 16px; color: var(--mute); display: flex; gap: 12px; flex-wrap: wrap; }
  .replicas { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .rep { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ok); }
  .rep.on { background: var(--ok); }
  .rep.extra { border-color: var(--warn); }
  .rep.extra.on { background: var(--warn); }
  .rep-count { font-family: var(--mono); font-size: 16px; color: var(--mute); margin-left: 4px; }
  .arrow { height: 22px; margin-left: 28px; border-left: 2px solid var(--line-strong); position: relative; }
  .arrow::after {
    content: ""; position: absolute; left: -7px; bottom: -2px; width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--line-strong);
  }
  .arrow span { position: absolute; left: 14px; top: 1px; font-size: 14px; color: var(--mute); font-family: var(--mono); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-family: var(--mono); font-size: 15px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; color: var(--body); background: var(--panel-2); }
  .chip.latest { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .chip.new { animation: pop 3s ease-out; }
  @keyframes pop { 0% { transform: scale(.6); background: var(--accent); color: var(--panel); } 15% { transform: scale(1.08); } 100% { transform: none; } }

  .activity { margin-top: 16px; display: grid; gap: 8px; }
  .activity ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .activity li { font-family: var(--mono); font-size: 16px; color: var(--body); display: flex; gap: 10px; align-items: baseline; min-width: 0; }
  .activity li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phase-running { color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  .phase-ok { color: var(--ok); }
  .phase-bad { color: var(--danger); }
  .empty { color: var(--mute); font-size: 18px; margin-top: 6px; }

  .keys { position: fixed; right: 12px; bottom: 8px; font-family: var(--mono); font-size: 13px; color: var(--mute); opacity: .7; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    .top { padding: 10px 16px; }
    .rail li { font-size: 0; }
    .rail li[data-state="now"] { font-size: 14px; }
    .chapter-head h2 { font-size: 34px; }
    .idea { font-size: 22px; }
    .q-text { font-size: 23px; }
    .opt { font-size: 19px; }
    .keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<header class="top">
  <div class="brand"><h1>GitOps dal vivo</h1><span class="eyebrow">gitlab · argocd · kargo</span></div>
  <span class="pill" id="provider">gke</span>
  <ol class="rail" id="rail" aria-label="Capitoli della demo"></ol>
  <span class="pill" id="link" role="status">avvio</span>
</header>

<main>
  <section class="story" aria-live="polite">
    <div class="chapter-head" id="head">

      <p class="q-text" id="q-text"></p>

    <div class="look" id="look"></div>
    <p class="status-line" id="note" hidden><span class="dot"></span><span id="note-text"></span></p>
  </section>

  <aside class="card pipeline" aria-label="Pipeline live">
    <div class="eyebrow"><span>Pipeline live</span><span id="ts"></span></div>

    <div class="node" id="wh">
      <div class="node-top">
        <span class="node-name">Warehouse</span>
        <span class="badges"><span class="badge" id="wh-constraint">-</span></span>
      </div>
      <div class="meta" style="margin-top:4px"><span>osserva public.ecr.aws/nginx/nginx</span></div>
      <div class="chips" id="wh-chips"></div>
    </div>
    <div id="stages"></div>

    <div class="activity">
      <span class="eyebrow">Attivita'</span>
      <ul id="promos"></ul>
      <ul id="events"></ul>
    </div>
  </aside>
</main>
<div class="keys" aria-hidden="true">frecce capitolo · spazio fase · m prova · t tema</div>

          why: "Il Freight precedente e' ancora promuovibile: Kargo riscrive stage/staging e ArgoCD sincronizza. Un rollout undo cambia il cluster ma non il git, quindi resta come drift." }
      ] },
    { id: "debrief", points: ["Il git come unica fonte di verita', dall'inizio alla fine", "Cosa cambia in produzione", "Domande"], title: "Debriefing", short: "Debriefing",
      idea: "Tre domande per chiudere, e il limite da dichiarare.",
      look: [],
      questions: [
        { q: "Tolgo l'annotazione kargo.akuity.io/authorized-stage dalla Application di prod. Alla prossima promozione?",
          o: ["Nessun effetto, e' solo un'etichetta", "Il commit su stage/prod avviene, poi lo step argocd-update viene rifiutato", "Kargo rimette l'annotazione", "GitLab rifiuta il push"], a: 1,
          why: "L'annotazione e' il consenso della Application a farsi pilotare da quello Stage. I passi git riescono, argocd-update no: il git e' avanti, il cluster no." },
        { q: "Perche' i branch stage/* contengono YAML gia' renderizzato invece degli overlay?",
          o: ["Perche' ArgoCD non supporta kustomize", "Il diff di una promozione mostra gli oggetti esatti che verranno applicati, e il rollback e' un commit precedente", "Per occupare meno spazio", "Per far condividere lo stesso branch a piu' stage"], a: 1,
          why: "E' il rendered manifests pattern: la review guarda YAML finito, non una ricetta da eseguire a mente." },
        { q: "GitLab gira nello stesso cluster che ArgoCD riconcilia. Qual e' il limite?",
          o: ["ArgoCD non legge repo in HTTP", "Dipendenza circolare: se il cluster cade, cade anche la fonte di verita' da cui ricostruirlo", "Kargo non puo' scrivere nel repo", "Nessuno"], a: 1,
          why: "Va bene per una demo autonoma. In produzione il repo sta fuori dal cluster che descrive, cosi' il cluster si ricostruisce da li'." }
      ] }
  ];

  var SAMPLE_LIVE = {
    ts: new Date().toISOString(),
    warehouse: { name: "kargo-demo", constraint: "~1.27.0", freight: [
      { name: "f2", alias: "brave-otter", tag: "1.27.5" },
      { name: "f1", alias: "wiggly-woodpecker", tag: "1.26.3" } ] },
    stages: [
      { name: "dev", freight: "brave-otter", tag: "1.27.5", health: "Healthy", ready: 1, desired: 1, sync: "Synced", appHealth: "Healthy", commit: "3f9c2a1", auto: true, selfHeal: true },
      { name: "staging", freight: "wiggly-woodpecker", tag: "1.26.3", health: "Healthy", ready: 2, desired: 2, sync: "Synced", appHealth: "Healthy", commit: "81be0d4", auto: false, selfHeal: false },
      { name: "prod", freight: "wiggly-woodpecker", tag: "1.26.3", health: "Healthy", ready: 3, desired: 3, sync: "Synced", appHealth: "Healthy", commit: "c07a5e9", auto: false, selfHeal: false } ],
    promotions: [
      { stage: "dev", freight: "brave-otter", phase: "Succeeded" },
      { stage: "prod", freight: "wiggly-woodpecker", phase: "Succeeded" } ],
    events: ["15:03:58 dev  Scaled up replica set kargo-demo from 1 to 4", "15:03:59 dev  Scaled down replica set kargo-demo from 4 to 1"]
  };

  var DEFAULT_URLS = { gitlab: "http://localhost:8080", argocd: "https://localhost:8443", kargo: "https://localhost:8081" };
  var LETTERS = ["A", "B", "C", "D"];
  var $ = function (id) { return document.getElementById(id); };

  var rehearsal = location.protocol === "file:";
  var forcedRehearsal = false;
  var local = { chapter: 0, phase: "intro", question: 0 };
  var driven = null;
  var lastState = 0, lastLive = 0, liveData = null;
  var rendered = "";
  var prevStage = {}, knownFreight = null;

  function txt(v) { return v === undefined || v === null || v === "" ? "-" : String(v); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function badge(text, tone) {
    var b = el("span", "badge", text);
    if (tone) b.setAttribute("data-tone", tone);
    return b;
  }
  function inRehearsal() { return rehearsal || forcedRehearsal; }

  // ---------- tema ----------
  try {
    var t = localStorage.getItem("palco-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* storage non disponibile */ }
  function toggleTheme() {
    var cur = document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("palco-theme", next); } catch (e) { /* storage non disponibile */ }
  }

  // ---------- rail ----------
  CHAPTERS.forEach(function (c) { $("rail").appendChild(el("li", "", c.short)); });

  function current() {
    if (!inRehearsal() && driven) {
      var idx = CHAPTERS.findIndex(function (c) { return c.id === driven.chapter; });
      return { chapter: idx < 0 ? 0 : idx, phase: driven.phase || "intro", question: Number(driven.question) || 0,
               note: driven.note || "", urls: driven.urls || DEFAULT_URLS, provider: driven.provider || "" };
    }
    return { chapter: local.chapter, phase: local.phase, question: local.question, note: "", urls: DEFAULT_URLS, provider: "" };
  }

  function renderStory() {
    var s = current();
    var c = CHAPTERS[s.chapter];
    var qi = Math.min(Math.max(s.question, 0), c.questions.length - 1);
    var key = [s.chapter, s.phase, qi, s.note, JSON.stringify(s.urls)].join("|");
    if (key === rendered) return;
    var chapterChanged = rendered.split("|")[0] !== String(s.chapter);
    var questionChanged = rendered.split("|")[2] !== String(qi) || chapterChanged;
    rendered = key;

    Array.prototype.forEach.call($("rail").children, function (li, i) {
      li.setAttribute("data-state", i < s.chapter ? "done" : i === s.chapter ? "now" : "todo");
    });
    if (s.provider) $("provider").textContent = s.provider;

    $("ch-num").textContent = "capitolo " + (s.chapter + 1) + " di " + CHAPTERS.length;
    $("ch-title").textContent = c.title;
    $("ch-idea").textContent = c.idea;
    if (chapterChanged) { $("head").classList.remove("fade"); void $("head").offsetWidth; $("head").classList.add("fade"); }

    var pl = $("ch-points");
    pl.textContent = "";
    (c.points || []).forEach(function (t) { pl.appendChild(el("li", "", t)); });
    pl.hidden = s.phase !== "intro";

    var qBox = $("question");
    var q = c.questions[qi];
    if (s.phase === "intro" || !q) {
      qBox.hidden = true;
    } else {
      qBox.hidden = false;
      qBox.setAttribute("data-phase", s.phase);
      if (questionChanged) { qBox.classList.remove("fade"); void qBox.offsetWidth; qBox.classList.add("fade"); }
      $("q-count").textContent = c.questions.length > 1 ? "domanda " + (qi + 1) + " di " + c.questions.length : "";
      $("q-text").textContent = q.q;
      var ol = $("q-opts");
      ol.textContent = "";
      q.o.forEach(function (text, i) {
        var li = el("li", "opt" + (i === q.a ? " right" : ""));
        li.appendChild(el("span", "letter", LETTERS[i]));
        li.appendChild(el("span", "", text));
        ol.appendChild(li);
      });
      var why = $("q-why");
      why.hidden = s.phase !== "reveal";
      why.textContent = LETTERS[q.a] + ". " + q.why;
    }

    var look = $("look");
    look.textContent = "";
    if (c.look.length) {
      look.appendChild(el("span", "eyebrow", "Guarda in"));
      c.look.forEach(function (l) {
        var a = el("a", "", l[0]);
        a.href = (s.urls[l[1]] || DEFAULT_URLS[l[1]]).replace(/\/$/, "") + l[2];
        a.target = "_blank";
        a.rel = "noopener";
        look.appendChild(a);
      });
    }
    $("note").hidden = !s.note;
    $("note-text").textContent = s.note;
  }

  // ---------- pipeline ----------
  function syncTone(v) { return v === "Synced" ? "ok" : v === "OutOfSync" ? "warn" : ""; }
  function healthTone(v) { return v === "Healthy" ? "ok" : (v === "Degraded" || v === "Unhealthy") ? "danger" : v === "Progressing" ? "accent" : ""; }
  function phaseClass(p) {
    if (p === "Succeeded") return "phase-ok";
    if (p === "Errored" || p === "Failed" || p === "Aborted") return "phase-bad";
    return "phase-running";
  }

  function renderLive() {
    var d = inRehearsal() ? SAMPLE_LIVE : liveData;
    if (!d) return;
    var wh = d.warehouse || {};
    $("wh-constraint").textContent = "vincolo " + txt(wh.constraint);
    var freight = Array.isArray(wh.freight) ? wh.freight : [];
    var chips = $("wh-chips");
    chips.textContent = "";
    var names = freight.map(function (f) { return f.name; });
    if (!freight.length) chips.appendChild(el("span", "empty", "nessun Freight ancora"));
    freight.slice(0, 6).forEach(function (f, i) {
      var chip = el("span", "chip" + (i === 0 ? " latest" : ""), txt(f.alias) + "  " + txt(f.tag));
      if (knownFreight && knownFreight.indexOf(f.name) === -1) chip.classList.add("new");
      chips.appendChild(chip);
    });
    knownFreight = names;

    var stages = Array.isArray(d.stages) ? d.stages : [];
    var devTag = (stages.find(function (s) { return s.name === "dev"; }) || {}).tag;
    var box = $("stages");
    box.textContent = "";
    var labels = { dev: "promozione automatica", staging: "promozione manuale, da dev", prod: "promozione manuale, da staging" };
    stages.forEach(function (st) {
      var arrow = el("div", "arrow");
      arrow.appendChild(el("span", "", labels[st.name] || ""));
      box.appendChild(arrow);

      var node = el("div", "node");
      var top = el("div", "node-top");
      top.appendChild(el("span", "node-name", st.name));
      var bs = el("span", "badges");
      if (st.auto) bs.appendChild(badge("auto", "accent"));
      if (st.selfHeal) bs.appendChild(badge("self-heal", "accent"));
      if (st.tag) {
        bs.appendChild(badge(txt(st.sync), syncTone(st.sync)));
        bs.appendChild(badge(txt(st.appHealth || st.health), healthTone(st.appHealth || st.health)));
      }
      top.appendChild(bs);
      node.appendChild(top);

      if (!st.tag) {
        node.appendChild(el("p", "empty", "in attesa della prima promozione"));
        prevStage[st.name] = "";
        box.appendChild(node);
        return;
      }

      var body = el("div", "node-body");
      var tag = el("span", "tag");
      tag.appendChild(el("small", "", "nginx"));
      tag.appendChild(document.createTextNode(txt(st.tag)));
      if (st.tag && devTag && st.tag !== devTag) {
        tag.classList.add("behind");
        tag.title = "versione precedente rispetto a dev";
      }
      body.appendChild(tag);

      var reps = el("span", "replicas");
      var ready = Number(st.ready) || 0, desired = Number(st.desired) || 0;
      var declared = Number(st.declared) || desired;
      var total = Math.max(ready, desired, declared);
      for (var i = 0; i < Math.min(total, 10); i++) {
        var r = el("span", "rep" + (i < ready ? " on" : "") + (i >= declared ? " extra" : ""));
        reps.appendChild(r);
      }
      reps.appendChild(el("span", "rep-count", ready + "/" + desired));
      body.appendChild(reps);
      node.appendChild(body);

      var meta = el("div", "meta");
      meta.appendChild(el("span", "", "freight " + txt(st.freight)));
      meta.appendChild(el("span", "", "commit " + txt(st.commit)));
      if (st.tag && devTag && st.tag !== devTag) meta.appendChild(el("span", "", "versione precedente"));
      node.appendChild(meta);

      var sig = [st.tag, st.ready, st.desired, st.sync].join("|");
      if (prevStage[st.name] !== undefined && prevStage[st.name] !== sig) {
        node.classList.add("flash");
        setTimeout(function () { node.classList.remove("flash"); }, 2000);
      }
      prevStage[st.name] = sig;
      box.appendChild(node);
    });
    if (!stages.length) box.appendChild(el("p", "empty", "Stage non ancora creati"));

    var pl = $("promos");
    pl.textContent = "";
    (Array.isArray(d.promotions) ? d.promotions : []).slice(0, 4).forEach(function (p) {
      var li = el("li");
      li.appendChild(el("span", phaseClass(p.phase), txt(p.phase)));
      li.appendChild(el("span", "", txt(p.stage) + "  " + txt(p.freight)));
      pl.appendChild(li);
    });
    var evl = $("events");
    evl.textContent = "";
    (Array.isArray(d.events) ? d.events : []).slice(-5).forEach(function (e) {
      var li = el("li");
      li.appendChild(el("span", "", txt(e)));
      evl.appendChild(li);
    });
    $("ts").textContent = d.ts ? new Date(d.ts).toLocaleTimeString("it-IT") : "";
  }

  function renderLink() {
    var p = $("link");
    if (inRehearsal()) { p.textContent = "prova · dati di esempio"; p.setAttribute("data-tone", "warn"); return; }
    var age = lastLive ? Math.round((Date.now() - lastLive) / 1000) : null;
    if (!lastState && !lastLive) { p.textContent = "offline"; p.setAttribute("data-tone", "danger"); return; }
    if (age === null || age > 15) { p.textContent = "offline"; p.setAttribute("data-tone", "danger"); return; }
    p.textContent = "live · " + age + "s fa";
    p.setAttribute("data-tone", "ok");
  }

  function poll(url, onData) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(onData).catch(function () { /* il badge mostra offline */ });
  }

  if (!rehearsal) {
    setInterval(function () {
      poll("state.json", function (j) { driven = j; lastState = Date.now(); renderStory(); });
    }, 1000);
    setInterval(function () {
      poll("live.json", function (j) {
        // Il collector riscrive il file ogni 3s: se ts non cambia non serve ridisegnare.
        if (liveData && j.ts === liveData.ts) { lastLive = Date.now(); return; }
        liveData = j; lastLive = Date.now(); renderLive();
      });
    }, 2000);
  }
  setInterval(renderLink, 1000);

  // ---------- tastiera: modalita' prova ----------
  function step(dir) {
    var c = CHAPTERS[local.chapter];
    if (dir > 0) {
      if (local.phase === "intro") local.phase = "ask";
      else if (local.phase === "ask") local.phase = "reveal";
      else if (local.question < c.questions.length - 1) { local.question++; local.phase = "ask"; }
      else if (local.chapter < CHAPTERS.length - 1) { local.chapter++; local.question = 0; local.phase = "intro"; }
    }
  }
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "t") { toggleTheme(); return; }
    if (e.key === "m" && !rehearsal) {
      forcedRehearsal = !forcedRehearsal;
      if (forcedRehearsal) { var s = current(); local.chapter = s.chapter; }
      rendered = ""; prevStage = {}; knownFreight = null;
      renderStory(); renderLive(); renderLink();
      return;
    }
    if (!inRehearsal()) return;
    if (e.key === "ArrowRight") { local.chapter = Math.min(local.chapter + 1, CHAPTERS.length - 1); local.phase = "intro"; local.question = 0; }
    else if (e.key === "ArrowLeft") { local.chapter = Math.max(local.chapter - 1, 0); local.phase = "intro"; local.question = 0; }
    else if (e.key === " ") { e.preventDefault(); step(1); }
    else return;
    renderStory();
  });

  renderStory();
  renderLive();
  renderLink();
}());
</script>
</body>
</html>
